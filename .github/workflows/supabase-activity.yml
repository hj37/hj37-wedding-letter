name: Keep Supabase active

on:
  schedule:
    # 09:17, 15:17, and 21:17 Korea Standard Time.
    - cron: '17 0,6,12 * * *'
    # Record repository activity on the first of each month at 09:23 KST.
    - cron: '23 0 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  activity:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 0,6,12 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4

      - name: Send a read-only database request
        run: node scripts/wake-supabase.mjs

  repository-heartbeat:
    if: github.event_name == 'schedule' && github.event.schedule == '23 0 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4

      - name: Record scheduled repository activity
        run: |
          date -u +'%Y-%m-%dT%H:%M:%SZ' > .github/repository-heartbeat.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/repository-heartbeat.txt
          if git diff --cached --quiet; then
            echo 'Repository heartbeat is already current.'
          else
            git commit -m 'chore: record scheduled repository activity'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
