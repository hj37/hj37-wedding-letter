name: Deploy wedding invitation to GitHub Pages

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          mkdir -p dist dist/audio
          cp index.html style.css script.js .nojekyll dist/
          cp -R images dist/
          if [ -f audio/bgm.mp3 ]; then cp audio/bgm.mp3 dist/audio/bgm.mp3; fi

      - name: Decrypt wedding photos for public Pages deployment
        env:
          WEDDING_PHOTOS_PASSPHRASE: ${{ secrets.WEDDING_PHOTOS_PASSPHRASE }}
          PHOTOS_INPUT_DIR: photos/encrypted
          PHOTOS_OUTPUT_DIR: dist/images
        run: |
          shopt -s nullglob
          encrypted_photos=(photos/encrypted/*.enc)
          if (("${#encrypted_photos[@]}" == 0)); then
            echo "No encrypted wedding photos found; keeping the design placeholders."
            exit 0
          fi
          if [[ -z "${WEDDING_PHOTOS_PASSPHRASE:-}" ]]; then
            echo "Set the WEDDING_PHOTOS_PASSPHRASE Actions secret before deploying encrypted photos." >&2
            exit 1
          fi
          node scripts/decrypt-photos.mjs

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
